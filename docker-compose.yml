services:
  hub:
    build:
      context: .
      args:
        VERSION: ${AC_VERSION:-dev}
    image: agentic-chat:${AC_VERSION:-dev}
    restart: unless-stopped
    ports:
      # Local only by default, because the hub speaks plain http. Put a reverse
      # proxy with https in front of it, see docs/self-hosting.md.
      - "${AC_BIND:-127.0.0.1:8080}:8080"
    environment:
      AC_TRUST_PROXY: ${AC_TRUST_PROXY:-false}
      AC_MAX_CONNECTIONS: ${AC_MAX_CONNECTIONS:-0}
      # Collect garbage harder near the memory limit instead of getting killed at it.
      GOMEMLIMIT: 230MiB
    volumes:
      - data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
